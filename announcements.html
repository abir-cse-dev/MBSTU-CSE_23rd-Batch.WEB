<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements | MBSTU CSE '23</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* --- Announcements Layout & Cards --- */
      .page-header {
        text-align: center;
        padding: 40px 20px 20px;
      }

      .page-header h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
      }

      .page-header p {
        color: #a0a0a0;
        font-size: 0.95rem;
      }

      .announcements-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .announcement-card {
        background: #18181c;
        border: 1px solid #2a2a30;
        border-radius: 12px;
        padding: 24px;
        position: relative;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
      }

      .announcement-card:hover {
        border-color: #3b82f6;
      }

      .announcement-card.pinned {
        border-color: #ef4444;
        background: #1f1416;
      }

      .announcement-badge {
        display: inline-block;
        background: #ef4444;
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      .announcement-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .announcement-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #ffffff;
        margin: 0;
      }

      .announcement-date {
        font-size: 0.85rem;
        color: #888;
        white-space: nowrap;
      }

      .announcement-text {
        font-size: 0.95rem;
        color: #cccccc;
        line-height: 1.6;
        margin: 0 0 16px 0;
      }

      .announcement-footer {
        font-size: 0.8rem;
        color: #71717a;
        border-top: 1px solid #27272a;
        padding-top: 12px;
      }
      /* --- Admin Button Styling --- */

      .admin-btn {
        position: relative;
        top: 20px;
        left: 20px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background-color: rgba(255, 255, 255, 0.05);
        color: #e4e4e7;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Shield Icon */
      .admin-icon {
        width: 16px;
        height: 16px;
        color: #a1a1aa;
        transition: color 0.2s ease-in-out;
      }

      /* Hover Effects (Mouse/Desktop only to prevent sticky touch states) */
      @media (hover: hover) {
        .admin-btn:hover {
          background-color: rgba(59, 130, 246, 0.15); /* Accent tint */
          border-color: #3b82f6;
          color: #ffffff;
          box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
          transform: translateY(-1px);
        }

        .admin-btn:hover .admin-icon {
          color: #60a5fa;
        }
      }

      /* Active Press Effect */
      .admin-btn:active {
        transform: translateY(0);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <a href="admin.html" class="admin-btn">
      <svg
        class="admin-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <span>Admin</span>
    </a>
    <!-- Header -->
    <header class="page-header">
      <h1>Class Announcements</h1>
      <p>Official notices and department updates.</p>
    </header>

    <!-- Container -->
    <main class="announcements-container" id="noticesList">
      <p style="text-align: center; color: #888">Loading notices...</p>
    </main>

    <script>
      async function fetchAnnouncements() {
        const container = document.getElementById("noticesList");
        try {
          const res = await fetch("/api/announcements");

          if (!res.ok) {
            throw new Error(`API error: ${res.status}`);
          }

          const notices = await res.json();

          if (!notices || notices.length === 0) {
            container.innerHTML =
              '<p style="text-align:center; color:#888;">No announcements posted yet.</p>';
            return;
          }

          container.innerHTML = notices
            .map(
              (notice) => `
          <article class="announcement-card ${notice.isUrgent ? "pinned" : ""}">
            ${notice.isUrgent ? '<div class="announcement-badge">Urgent</div>' : ""}
            <div class="announcement-header">
              <h2 class="announcement-title">${notice.title}</h2>
              <span class="announcement-date">${notice.date}</span>
            </div>
            <p class="announcement-text">${notice.text}</p>
            <div class="announcement-footer">
              <span class="author">Posted by: ${notice.author}</span>
            </div>
          </article>
        `,
            )
            .join("");
        } catch (err) {
          container.innerHTML = `<p style="text-align:center; color:#ef4444;">Unable to load notices. Make sure KV binding is set in Cloudflare.</p>`;
        }
      }

      fetchAnnouncements();
    </script>
  </body>
</html>
