<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | MBSTU CSE '23</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .admin-wrapper {
        max-width: 650px;
        margin: 40px auto;
        padding: 0 20px;
      }

      /* Card Box Styles */
      .admin-card {
        background: #18181c;
        border: 1px solid #27272a;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
      }

      .admin-card h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 1.2rem;
        color: #fff;
      }

      /* Login Screen Overlay/Card */
      #loginScreen {
        max-width: 400px;
        margin: 80px auto;
        text-align: center;
      }

      #loginScreen h2 {
        font-size: 1.4rem;
        margin-bottom: 8px;
      }

      #loginScreen p {
        color: #a1a1aa;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }

      /* Form Inputs */
      .form-group {
        margin-bottom: 16px;
        text-align: left;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #ccc;
        font-size: 0.85rem;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        background: #09090b;
        border: 1px solid #27272a;
        color: #fff;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 0.95rem;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #3b82f6;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-group input {
        width: auto;
      }

      /* Buttons */
      .btn-primary {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .btn-primary:hover {
        background: #1d4ed8;
      }

      /* Manage List Items */
      .delete-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #09090b;
        border: 1px solid #27272a;
        border-radius: 8px;
        margin-bottom: 10px;
        gap: 12px;
      }

      .delete-item-info {
        overflow: hidden;
      }

      .delete-item-title {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 500;
        margin: 0 0 4px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .delete-item-date {
        color: #71717a;
        font-size: 0.8rem;
      }

      .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
        border: 1px solid rgba(239, 68, 68, 0.3);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
        transition: all 0.2s ease;
      }

      .btn-danger:hover {
        background: #ef4444;
        color: white;
      }

      /* Admin Top Bar */
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .btn-logout {
        background: transparent;
        border: 1px solid #27272a;
        color: #a1a1aa;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .btn-logout:hover {
        color: #fff;
        border-color: #52525b;
      }

      /* Utility */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->

    <main class="admin-wrapper">
      <!-- 1. LOGIN SCREEN (Shown if not authenticated) -->
      <div id="loginScreen" class="admin-card">
        <h2>Admin Access</h2>
        <p>Enter password to manage announcements.</p>
        <form id="loginForm">
          <div class="form-group">
            <input
              type="password"
              id="loginPassword"
              placeholder="Enter admin password"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Unlock Panel</button>
        </form>
      </div>

      <!-- 2. MAIN DASHBOARD (Hidden until logged in) -->
      <div id="dashboard" class="hidden">
        <div class="admin-header">
          <h1 style="font-size: 1.5rem; margin: 0">Dashboard</h1>
          <button onclick="logout()" class="btn-logout">Logout</button>
        </div>

        <!-- Create Notice Box -->
        <div class="admin-card">
          <h2>Post New Notice</h2>
          <form id="noticeForm">
            <div class="form-group">
              <label>Notice Title</label>
              <input
                type="text"
                id="title"
                required
                placeholder="e.g., Midterm Exam Schedule"
              />
            </div>
            <div class="form-group">
              <label>Notice Details</label>
              <textarea
                id="text"
                rows="4"
                required
                placeholder="Type the full announcement body..."
              ></textarea>
            </div>
            <div class="form-group">
              <label>Author / Position</label>
              <input
                type="text"
                id="author"
                placeholder="Class Representative"
              />
            </div>
            <div class="form-group checkbox-group">
              <input type="checkbox" id="isUrgent" />
              <label for="isUrgent">Mark as Urgent / Priority Notice</label>
            </div>
            <button type="submit" class="btn-primary">
              Publish Announcement
            </button>
          </form>
        </div>

        <!-- Manage Existing Notices Box -->
        <div class="admin-card">
          <h2>Active Notices</h2>
          <div id="manageList">
            <p style="color: #888; font-size: 0.9rem">
              Loading announcements...
            </p>
          </div>
        </div>
      </div>
    </main>

    <script>
      let authToken = sessionStorage.getItem("admin_session") || "";

      // On page load, verify saved session password
      if (authToken) {
        verifyPassword(authToken).then((isValid) => {
          if (isValid) {
            showDashboard();
          } else {
            logout();
          }
        });
      }

      // Login Form Submission
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const pass = document.getElementById("loginPassword").value.trim();

          if (!pass) return;

          const isValid = await verifyPassword(pass);
          if (isValid) {
            authToken = pass;
            sessionStorage.setItem("admin_session", pass);
            showDashboard();
          } else {
            alert("Incorrect admin password! Access denied.");
            document.getElementById("loginPassword").value = "";
            document.getElementById("loginPassword").focus();
          }
        });

      // Function to ping Cloudflare /api/auth endpoint
      async function verifyPassword(password) {
        try {
          const res = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          return res.ok;
        } catch (err) {
          // Offline / local preview fallback warning
          console.warn("API not reachable locally.");
          return false;
        }
      }

      function showDashboard() {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadManageList();
      }

      function logout() {
        sessionStorage.removeItem("admin_session");
        authToken = "";
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("loginPassword").value = "";
      }

      // Publish Notice Handler
      document
        .getElementById("noticeForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const payload = {
            adminPassword: authToken,
            title: document.getElementById("title").value,
            text: document.getElementById("text").value,
            author: document.getElementById("author").value,
            isUrgent: document.getElementById("isUrgent").checked,
          };

          const res = await fetch("/api/announcements", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            alert("Notice published!");
            document.getElementById("title").value = "";
            document.getElementById("text").value = "";
            document.getElementById("author").value = "";
            document.getElementById("isUrgent").checked = false;
            loadManageList();
          } else {
            alert("Session expired or password invalid.");
            logout();
          }
        });

      // Fetch List
      async function loadManageList() {
        const container = document.getElementById("manageList");
        try {
          const res = await fetch("/api/announcements");
          const notices = await res.json();

          if (!notices || notices.length === 0) {
            container.innerHTML =
              '<p style="color:#888; font-size: 0.9rem;">No active announcements.</p>';
            return;
          }

          container.innerHTML = notices
            .map(
              (notice) => `
        <div class="delete-item">
          <div class="delete-item-info">
            <p class="delete-item-title">${notice.title}</p>
            <span class="delete-item-date">${notice.date}</span>
          </div>
          <button class="btn-danger" onclick="deleteNotice(${notice.id})">Delete</button>
        </div>
      `,
            )
            .join("");
        } catch (err) {
          container.innerHTML =
            '<p style="color:#ef4444; font-size: 0.9rem;">Failed to load notices.</p>';
        }
      }

      // Delete Notice Handler
      async function deleteNotice(id) {
        if (!confirm("Are you sure you want to delete this notice?")) return;

        const res = await fetch("/api/announcements", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, adminPassword: authToken }),
        });

        if (res.ok) {
          loadManageList();
        } else {
          alert("Failed to delete. Session invalid.");
          logout();
        }
      }
    </script>
  </body>
</html>
